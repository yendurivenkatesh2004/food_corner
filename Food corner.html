<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Corner</title>
<style>
 *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#ff6b35;
    color:white;
    text-align:center;
    padding:20px;
}

.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    width:220px;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:4px 4px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.1);
}

.card h2{
    margin-bottom:10px;
}

.card p{
    color:gray;
    margin-bottom:10px;
}

.card h3{
    color:#ff6b35;
    margin-bottom:15px;
}

.card button{
    background:#ff6b35;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#e85a2a;
}

footer{
    background:#333;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
</style>
</head>
<body>

<header>
    <h1>🍔 Food Corner</h1>
    <p>Delicious Food for Students</p>
</header>

<section class="menu">

    <div class="card">
        <h2>🍕 Pizza</h2>
        <p>Cheesy Veg Pizza</p>
        <h3>₹150</h3>
        <button onclick="order('Pizza')">Order</button>
    </div>

    <div class="card">
        <h2>🍔 Burger</h2>
        <p>Chicken Burger</p>
        <h3>₹120</h3>
        <button onclick="order('Burger')">Order</button>
    </div>

    <div class="card">
        <h2>🍟 French Fries</h2>
        <p>Crispy Fries</p>
        <h3>₹80</h3>
        <button onclick="order('French Fries')">Order</button>
    </div>

    <div class="card">
        <h2>🥪 Sandwich</h2>
        <p>Veg Sandwich</p>
        <h3>₹90</h3>
        <button onclick="order('Sandwich')">Order</button>
    </div>

    <div class="card">
        <h2>🥤 Cold Drink</h2>
        <p>Fresh Soft Drink</p>
        <h3>₹50</h3>
        <button onclick="order('Cold Drink')">Order</button>
    </div>

</section>

<footer>
    <p>© 2026 Food Corner | Designed by Student</p>
</footer>

<script src="script.js"></script>
</body>
</html>
